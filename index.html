zz<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Fira+Code:wght@400;600&family=Merriweather:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="topbar">
    <button id="theme-btn" class="secondary" type="button">☀️ Light mode</button>
    <select id="font-select" aria-label="Font style">
      <option value="system">System font</option>
      <option value="poppins">Poppins</option>
      <option value="merriweather">Merriweather</option>
      <option value="firacode">Fira Code</option>
      <option value="caveat">Handwriting</option>
    </select>
  </header>

  <main>
    <h1 class="neon-title">My Notes</h1>

    <!-- Login / Sign up (separate pages) -->
    <section id="auth-section" class="card neon-card">
      <div id="login-view">
        <h2>Welcome back</h2>
        <input id="login-email" type="email" placeholder="Email">
        <input id="login-password" type="password" placeholder="Password">
        <button id="login-btn" type="button">Log in</button>
        <p class="switch">No account yet? <a href="#" id="to-signup">Sign up</a></p>
      </div>

      <div id="signup-view" hidden>
        <h2>Create account</h2>
        <input id="signup-name" type="text" placeholder="Your name">
        <input id="signup-email" type="email" placeholder="Email">
        <input id="signup-password" type="password" placeholder="Password (6+ characters)">
        <button id="signup-btn" type="button">Sign up</button>
        <p class="switch">Already have an account? <a href="#" id="to-login">Log in</a></p>
      </div>

      <p id="auth-msg"></p>
    </section>

    <!-- Notes (hidden until logged in) -->
    <section id="notes-section" class="card" hidden>
      <div class="row space">
        <span id="greeting"></span>
        <button id="logout-btn" class="secondary" type="button">Log out</button>
      </div>

     <div class="plan-bar">
        <span id="plan-text"></span>
        <button id="upgrade-btn" type="button" hidden>Upgrade</button>
      </div>

      <div id="upgrade-box" class="upgrade-box" hidden>
        <h3>You've used your 2 free notes</h3>
        <p>Subscribe for KSh 150 per month to add unlimited notes and support this project.</p>
        <div class="row">
          <button id="subscribe-btn" type="button">Subscribe: KSh 150/month</button>
          <button id="close-upgrade" class="secondary" type="button">Not now</button>
        </div>
      </div> <input id="note-subject" list="subject-list" type="text" placeholder="Subject (e.g. Math)">
      <datalist id="subject-list"></datalist>
      <input id="note-title" type="text" placeholder="Title">
      <textarea id="note-body" rows="5" placeholder="Write your note..."></textarea>
      <div class="row">
        <button id="save-btn" type="button">Save note</button>
        <button id="cancel-btn" class="secondary" type="button" hidden>Cancel edit</button>
      </div>

      <hr>

      <input id="search" type="search" placeholder="Search notes...">
      <div id="subject-filters" class="chips"></div>
      <div id="notes-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>  
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <script src="app.js"></script>
</body>
</html>
