<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>My Notes</h1>

    <!-- Login section -->
    <section id="auth-section">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <div class="row">
        <button id="login-btn">Log in</button>
        <button id="signup-btn" class="secondary">Sign up</button>
      </div>
      <p id="auth-msg"></p>
    </section>

    <!-- Notes section (hidden until logged in) -->
    <section id="notes-section" hidden>
      <div class="row space">
        <span id="user-email"></span>
        <button id="logout-btn" class="secondary">Log out</button>
      </div>

      <input id="note-title" type="text" placeholder="Title">
      <textarea id="note-body" rows="5" placeholder="Write your note..."></textarea>
      <button id="save-btn">Save note</button>

      <div id="notes-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
